name: Standalone contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrbot_plugin_official_cards
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r astrbot_plugin_official_cards/requirements-dev.txt
      - run: python -B astrbot_plugin_official_cards/tests/run_unit.py
